# pre_run_optimizer/agentdropout —— AgentDropout 动态节点/边淘汰（ACL 2025）。
# 用法：optimize_langgraph(sg, method="agentdropout", state_file=..., round=r)
# apply 语义：加载两阶段训练产物，取第 round 轮 threshold 实现写回图；
# 被淘汰节点写 spec.meta["dropped"]=True（节点工厂据此本轮不执行）。
# 训练由 scripts/run_agentdropout_gsm8k.py 驱动（代码事实，对照原版 run_gsm8k.py）：
#   阶段一（dec）2 batch × 20 题：每 query 逐轮 opt.sample_skip(r)（确定性无环全图上
#   加权度 softmax 采样，被跳节点输出 'None.'），批末 opt.skip_reinforce（Adam lr=0.1），
#   两批后 opt.node_dropout()（=原版 update_masks_dec，每轮淘汰最小加权度节点）；
#   阶段二（diff）4 batch × 10 题（与阶段一同用 train 前 40 题）：逐轮 opt.sample_round(r)
#   边 REINFORCE，batch idx {1,3} 后各 edge_dropout(rate) 一次（=原版 update_masks_diff），
#   默认 rate 见脚本 --pruning-rate（README/论文口径 0.10；原版 argparse 默认 0.25）。
method: agentdropout
state_file: null               # 训练产物（run_agentdropout_gsm8k.py --phase train 落盘）
round: 0                       # 挂载哪一轮的拓扑（多轮实验由脚本逐轮取 realized_matrices(r)）
rounds: 2                      # 与训练时一致（状态校验不符显式报错）
